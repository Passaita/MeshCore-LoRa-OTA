; LoRa-OTA repeater for the RAK3401 (WisMesh 1W Booster): firmware updates over LoRa (src/helpers/fw_ota, docs/lora-ota).
; A slim "pure repeater": no GPS, external environment sensors, ToF or OLED display, and no in-app BLE OTA stack (the bootloader still does
; BLE DFU). Linked for the LoRa-OTA flash layout: 448 KiB app region, staging slot above it (boards/nrf52840_s140_v6_fwota.ld).
; Needs the LoRa-OTA bootloader. Build: pio run -e RAK_3401_lora_ota  (SOURCE_DATE_EPOCH set = byte-identical rebuilds)

[env:RAK_3401_lora_ota]
extends = nrf52_base
board = rak3401
board_check = true
board_build.ldscript = boards/nrf52840_s140_v6_fwota.ld
board_upload.maximum_size = 458752
build_flags = ${nrf52_base.build_flags}
  -I variants/rak3401
  -D RAK_3401
  -D RAK_BOARD
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1
  -D PIN_GPS_EN=-1
  -D ADVERT_NAME='"RAK3401 1W Repeater"'
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D NO_BLE_OTA
  -D RTC_RV3028_ONLY
  -D FW_OTA
  -D FIRMWARE_VERSION='"v1.17.28-rc21 LoRa-OTA on v1.17.1@b7cc0e6d"'
  -D BLE_OTA_DFU_NAME='"3401_DFU"'
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_SF=8
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak3401>
  +<helpers/sensors/SensorManager.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
  +<../examples/simple_repeater>
  +<helpers/fw_ota/FwTag.cpp>
  +<helpers/fw_ota/FwOtaSlots.cpp>
  +<helpers/fw_ota/FwOtaTransfer.cpp>
  +<helpers/fw_ota/RadioDiag.cpp>
lib_deps =
  ${nrf52_base.lib_deps}

; --- dev build: the same plus the development commands (fw fill / pending / stage / serve force / ctl init / 'fw pull *') ---
[env:RAK_3401_lora_ota_dev]
extends = env:RAK_3401_lora_ota
build_flags = ${env:RAK_3401_lora_ota.build_flags}
  -D FW_OTA_DEV
  -D FIRMWARE_VERSION='"v1.17.28-rc21-dev LoRa-OTA on v1.17.1@b7cc0e6d"'   ; dev builds must never pass for a release
