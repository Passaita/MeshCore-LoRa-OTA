; Local-only: slim "pure repeater" build for RAK3401 WisMesh 1W Booster.
; Strips GPS/u-blox, external I2C environment sensors, ToF, and the OLED display.
; Keeps: LoRa mesh, BLE DFU (start ota), filesystem, battery ADC, RTC autodiscover.

[env:RAK_3401_repeater_slim]
extends = nrf52_base
board = rak3401
board_check = true
build_flags = ${nrf52_base.build_flags}
  -I variants/rak3401
  -D RAK_3401
  -D RAK_BOARD
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1
  -D PIN_GPS_EN=-1
  -D ADVERT_NAME='"RAK3401 1W Repeater"'
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D FIRMWARE_VERSION='"v1.17.1-fwpull"'
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_SF=8
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak3401>
  +<helpers/sensors/SensorManager.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${nrf52_base.lib_deps}

; --- more aggressive: also drop the in-app BLE OTA stack (bootloader still does BLE DFU) ---
[env:RAK_3401_repeater_min]
extends = env:RAK_3401_repeater_slim
build_flags = ${env:RAK_3401_repeater_slim.build_flags}
  -D NO_BLE_OTA
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_SF=8
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1

; --- even more aggressive: also force the software clock (no RTC chip on the WisMesh Booster) ---
[env:RAK_3401_repeater_min2]
extends = env:RAK_3401_repeater_min
build_flags = ${env:RAK_3401_repeater_min.build_flags}
  -D NO_EXTERNAL_RTC

; --- fw_ota proof of concept: forked linker (staging slots) + PoC CLI ---
[env:RAK_3401_repeater_poc]
extends = env:RAK_3401_repeater_min2
board_build.ldscript = boards/nrf52840_s140_v6_fwota.ld
board_upload.maximum_size = 458752
; RAK12002 RTC (RV-3028 only): re-enable the RTC code that min2 turned off, in its small RV3028-only form
build_unflags =
  -D NO_EXTERNAL_RTC
  -D LORA_FREQ=869.618
  -D LORA_SF=8
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
build_flags = ${env:RAK_3401_repeater_min2.build_flags}
  -D RTC_RV3028_ONLY
  -D FW_OTA
  -D FIRMWARE_VERSION='"v1.17.28-rc6 LoRa-OTA on v1.17.1@d9c42964"'   ; the port tool fills in the base FIRMWARE_VERSION@commit
  -D BLE_OTA_DFU_NAME='"3401_DFU"'
build_src_filter = ${env:RAK_3401_repeater_min2.build_src_filter}
  +<helpers/fw_ota/FwTag.cpp>
  +<helpers/fw_ota/FwOtaSlots.cpp>
  +<helpers/fw_ota/FwOtaTransfer.cpp>
  +<helpers/fw_ota/RadioDiag.cpp>

; --- STOCK-behaving repeater + tag only: the repeater code WITHOUT any fw_ota (the slim env: no display / GPS / external sensors) with our linker
; script and the 16-byte firmware tag so this bootloader accepts it. Used as the relay in the multi-hop test. (The complete upstream
; RAK_3401_repeater with display + all sensors is ~496 KB and does NOT fit the 448 KiB app region of the fw-pull geometry.)
[env:RAK_3401_repeater_stocktag]
extends = env:RAK_3401_repeater_slim
board_build.ldscript = boards/nrf52840_s140_v6_fwota.ld
board_upload.maximum_size = 458752
build_flags = ${env:RAK_3401_repeater_slim.build_flags}
  -D ADVERT_NAME='"STOCK-RELAY"'
build_src_filter = ${env:RAK_3401_repeater_slim.build_src_filter}
  +<helpers/fw_ota/FwTag.cpp>
