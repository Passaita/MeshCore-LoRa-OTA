; LoRa-OTA repeater for the RAK3401 (WisMesh 1W Booster): firmware updates over LoRa (src/helpers/fw_ota, docs/lora-ota).
; A slim "pure repeater": no GPS, external environment sensors, ToF or OLED display, and no in-app BLE OTA stack (the bootloader still does
; BLE DFU). Linked for the LoRa-OTA flash layout: 448 KiB app region, staging slot above it (boards/nrf52840_s140_v6_fwota.ld).
; Needs the LoRa-OTA bootloader. Build: pio run -e RAK_3401_lora_ota  (SOURCE_DATE_EPOCH set = byte-identical rebuilds)

[env:RAK_3401_lora_ota]
extends = nrf52_base
board = rak3401
board_check = true
board_build.ldscript = boards/nrf52840_s140_v6_fwota.ld
board_upload.maximum_size = 458752
build_flags = ${nrf52_base.build_flags}
  -I variants/rak3401
  -D RAK_3401
  -D RAK_BOARD
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1
  -D PIN_GPS_EN=-1
  -D ADVERT_NAME='"RAK3401 1W Repeater"'
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D NO_BLE_OTA
  -D RTC_RV3028_ONLY
  -D FW_OTA
  -D FIRMWARE_VERSION='"v1.17.28-rc9 LoRa-OTA on @UPSTREAM@"'
  -D BLE_OTA_DFU_NAME='"3401_DFU"'
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_SF=8
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak3401>
  +<helpers/sensors/SensorManager.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
  +<../examples/simple_repeater>
  +<helpers/fw_ota/FwTag.cpp>
  +<helpers/fw_ota/FwOtaSlots.cpp>
  +<helpers/fw_ota/FwOtaTransfer.cpp>
  +<helpers/fw_ota/RadioDiag.cpp>
lib_deps =
  ${nrf52_base.lib_deps}

; --- dev build: the same plus the development commands (fw fill / pending / stage / serve force / ctl init / 'fw pull *') ---
[env:RAK_3401_lora_ota_dev]
extends = env:RAK_3401_lora_ota
build_flags = ${env:RAK_3401_lora_ota.build_flags}
  -D FW_OTA_DEV
  -D FIRMWARE_VERSION='"v1.17.28-rc9-dev LoRa-OTA on @UPSTREAM@"'   ; dev builds must never pass for a release

; --- Heltec V4 (ESP32-S3, 16 MB): the LoRa-OTA repeater. Same LoRa-OTA code, ESP32 install into the other app partition with
; probation + rollback. Table boards/lora_ota_esp32s3_16MB.csv. Build: pio run -e heltec_v4_lora_ota (docs/lora-ota/HELTEC-V4.md)
[env:heltec_v4_lora_ota]
extends = Heltec_lora32_v4
board_build.partitions = boards/lora_ota_esp32s3_16MB.csv
build_flags = ${Heltec_lora32_v4.build_flags}
  -D DISABLE_WIFI_OTA
  -D ENV_INCLUDE_GPS=0
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D ADVERT_NAME='"Heltec V4 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D FLEET_REPEATER_DEFAULTS
  -D FIRMWARE_VERSION='"v1.18.0-rc25 LoRa-OTA on v1.18.0@743bb28f"'
  -D FW_OTA
  -D FW_OTA_FWNUM=319
  -D FWOTA_DIAG_LOG=1
build_unflags =
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
  -D LORA_FREQ=869.618
  -D LORA_SF=8
build_src_filter = ${Heltec_lora32_v4.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/fw_ota/FwTag.cpp>
  +<helpers/fw_ota/FwOtaSlotsEsp32.cpp>
  +<helpers/fw_ota/FwOtaInstallEsp32.cpp>
  +<helpers/fw_ota/FwOtaTransfer.cpp>
  +<helpers/fw_ota/RadioDiag.cpp>
  +<helpers/fw_ota/lzma/LzmaDec.c>
lib_deps =
  ${esp32_base.lib_deps}
  bakercp/CRC32 @ ^2.0.0

; (Heltec port) the seeder: `fw pull-wifi` restarts into it - a Wi-Fi access point + a browser page that writes a .lota into the slot.
; Its own app ("factory" partition), installed once by USB with the repeater; never sent over LoRa, so its size costs no airtime.
; --- Heltec V4: the Wi-Fi seeder (`fw pull-wifi` restarts into it: an open access point + a page that writes a .lota into the slot).
; Its own app in the "factory" partition, installed once with the repeater; never sent over LoRa.
[env:heltec_v4_lora_ota_seeder]
extends = esp32_base
board = heltec_v4
board_build.partitions = boards/lora_ota_esp32s3_16MB.csv
build_flags = ${esp32_base.build_flags}
  -I variants/heltec_v4
  -D ARDUINO_USB_MODE=1
build_src_filter = -<*> +<../examples/lora_ota_seeder>
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3

; --- Heltec V4: the migrator (stock MeshCore -> LoRa-OTA over Wi-Fi, no USB; docs/lora-ota/HELTEC-V4-MIGRATOR.md). Built for the
; STOCK layout: stock MeshCore's own `start ota` page installs it into its other app partition.
[env:heltec_v4_lora_ota_migrator]
extends = esp32_base
board = heltec_v4
board_build.partitions = default_16MB.csv
build_flags = ${esp32_base.build_flags}
  -I variants/heltec_v4
  -D ARDUINO_USB_MODE=1
build_src_filter = -<*> +<../examples/lora_ota_migrator>
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3
